<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel da feature</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --ink: #1c1c1a; --muted: #6b6b66; --line: #e4e4df;
    --accent: #2f5bea; --ok: #1f8a4c; --warn: #b7791f; --bad: #c53030; --soft: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --card: #1d1d1b; --ink: #ecece8; --muted: #9a9a93; --line: #2e2e2b;
      --accent: #7b9cff; --ok: #4cc283; --warn: #e0a84a; --bad: #f07272; --soft: #22263a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
  header h1 { margin: 0 0 4px; font-size: 24px; }
  .meta { color: var(--muted); font-size: 13px; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--ok); }
  .resumo { display: flex; gap: 16px; align-items: center; margin: 16px 0 8px; flex-wrap: wrap; }
  .resumo .bar { flex: 1; min-width: 200px; }
  .filtros { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 8px 0 24px; font-size: 14px; }
  select, textarea, button { font: inherit; color: inherit; }
  select { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  h2 { font-size: 18px; margin: 32px 0 12px; }
  details.modulo { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; }
  details.modulo > summary { cursor: pointer; padding: 12px 16px; display: grid; grid-template-columns: 1fr 140px auto; gap: 12px; align-items: center; list-style: none; }
  details.modulo > summary::-webkit-details-marker { display: none; }
  .modulo-nome { font-weight: 600; }
  .modulo-desc { color: var(--muted); font-size: 13px; padding: 0 16px 8px; }
  .contagem { color: var(--muted); font-size: 13px; white-space: nowrap; }
  ul.tarefas { list-style: none; margin: 0; padding: 0 8px 8px; }
  ul.tarefas li { display: grid; grid-template-columns: 20px 72px 1fr auto; gap: 10px; padding: 8px; border-top: 1px solid var(--line); align-items: start; }
  .check { width: 16px; height: 16px; border: 1.5px solid var(--muted); border-radius: 4px; margin-top: 3px; display: grid; place-items: center; font-size: 12px; }
  li.feito .check { background: var(--ok); border-color: var(--ok); color: #fff; }
  li.feito .titulo { text-decoration: line-through; color: var(--muted); }
  .id { font: 12px/1.9 ui-monospace, Consolas, monospace; color: var(--muted); }
  .detalhe { color: var(--muted); font-size: 12.5px; }
  .tag { font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); white-space: nowrap; }
  .st-andamento { color: var(--accent); border-color: var(--accent); }
  .st-bloqueado { color: var(--bad); border-color: var(--bad); }
  .st-feito { color: var(--ok); border-color: var(--ok); }
  .duvida { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  .duvida.decidida { border-left-color: var(--ok); opacity: .75; }
  .duvida h3 { margin: 0 0 4px; font-size: 15.5px; }
  .duvida .ctx { color: var(--muted); font-size: 13.5px; margin: 0 0 10px; }
  .opcao { display: flex; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; cursor: pointer; }
  .opcao:has(input:checked) { border-color: var(--accent); background: var(--soft); }
  .opcao small { display: block; color: var(--muted); }
  .rec { color: var(--ok); font-size: 12px; font-weight: 600; margin-left: 6px; }
  textarea { width: 100%; min-height: 70px; margin-top: 6px; padding: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
  .acoes { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0; display: flex; gap: 12px; align-items: center; border-top: 1px solid var(--line); }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  button.sec { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .vazio { color: var(--muted); font-style: italic; }
  @media (max-width: 640px) {
    details.modulo > summary { grid-template-columns: 1fr auto; }
    details.modulo > summary .bar { display: none; }
    ul.tarefas li { grid-template-columns: 20px 1fr; }
    ul.tarefas li .id, ul.tarefas li .tag { grid-column: 2; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="titulo"></h1>
    <div class="meta" id="meta"></div>
  </header>

  <div class="resumo">
    <strong id="pct"></strong>
    <div class="bar"><span id="barra"></span></div>
    <span class="contagem" id="totais"></span>
  </div>

  <h2 id="h-duvidas">Dúvidas para sua decisão</h2>
  <div id="duvidas"></div>

  <h2>Tarefas por módulo</h2>
  <div class="filtros">
    <label>Agente <select id="f-agente"><option value="">todos</option></select></label>
    <label><input type="checkbox" id="f-ocultar"> ocultar concluídas</label>
  </div>
  <div id="modulos"></div>

  <div class="acoes">
    <button id="copiar">Copiar respostas</button>
    <button class="sec" id="limpar">Limpar respostas</button>
    <span class="meta" id="aviso"></span>
  </div>
</main>

<script>
(function () {
  var d = JSON.parse(document.getElementById('dados').textContent);
  var chave = 'painel:' + d.feature;
  var resp = {};
  try { resp = JSON.parse(localStorage.getItem(chave) || '{}'); } catch (e) {}
  function salvar() { try { localStorage.setItem(chave, JSON.stringify(resp)); } catch (e) {} }
  function el(tag, cls, txt) { var n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; }
  function stClasse(s) { s = (s || '').toLowerCase(); return s === 'feito' ? 'st-feito' : s === 'em andamento' ? 'st-andamento' : s.indexOf('bloqueado') === 0 ? 'st-bloqueado' : ''; }

  document.title = 'Painel — ' + d.feature;
  document.getElementById('titulo').textContent = 'Painel — ' + d.feature;
  document.getElementById('meta').textContent = 'Atualizado em ' + d.atualizado + (d.docs ? ' · docs: ' + d.docs : '');

  // Tarefas
  var todas = [], agentes = {};
  d.modulos.forEach(function (m) { m.tarefas.forEach(function (t) { todas.push(t); agentes[t.agente] = 1; }); });
  var feitas = todas.filter(function (t) { return t.status === 'feito'; }).length;
  var pct = todas.length ? Math.round(feitas * 100 / todas.length) : 0;
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('barra').style.width = pct + '%';
  document.getElementById('totais').textContent = feitas + ' de ' + todas.length + ' tarefas concluídas';

  var fAg = document.getElementById('f-agente'), fOc = document.getElementById('f-ocultar');
  Object.keys(agentes).sort().forEach(function (a) { var o = el('option', null, a); o.value = a; fAg.appendChild(o); });

  function renderModulos() {
    var box = document.getElementById('modulos'); box.innerHTML = '';
    d.modulos.forEach(function (m) {
      var lista = m.tarefas.filter(function (t) { return (!fAg.value || t.agente === fAg.value) && !(fOc.checked && t.status === 'feito'); });
      if (!lista.length && (fAg.value || fOc.checked)) return;
      var ok = m.tarefas.filter(function (t) { return t.status === 'feito'; }).length;
      var det = el('details', 'modulo'); det.open = ok < m.tarefas.length;
      var sum = el('summary');
      sum.appendChild(el('span', 'modulo-nome', m.nome));
      var bar = el('div', 'bar'), sp = el('span'); sp.style.width = (m.tarefas.length ? ok * 100 / m.tarefas.length : 0) + '%'; bar.appendChild(sp);
      sum.appendChild(bar);
      sum.appendChild(el('span', 'contagem', ok + '/' + m.tarefas.length));
      det.appendChild(sum);
      if (m.descricao) det.appendChild(el('div', 'modulo-desc', m.descricao));
      var ul = el('ul', 'tarefas');
      lista.forEach(function (t) {
        var li = el('li', t.status === 'feito' ? 'feito' : '');
        li.appendChild(el('span', 'check', t.status === 'feito' ? '✓' : ''));
        li.appendChild(el('span', 'id', t.id));
        var corpo = el('div');
        corpo.appendChild(el('div', 'titulo', t.titulo));
        var info = [t.agente];
        if (t.depende && t.depende.length) info.push('depende de ' + t.depende.join(', '));
        if (t.refs && t.refs.length) info.push(t.refs.join(', '));
        if (t.pronto) info.push('pronto quando: ' + t.pronto);
        corpo.appendChild(el('div', 'detalhe', info.join(' · ')));
        li.appendChild(corpo);
        li.appendChild(el('span', 'tag ' + stClasse(t.status), t.status));
        ul.appendChild(li);
      });
      det.appendChild(ul);
      box.appendChild(det);
    });
  }
  fAg.onchange = renderModulos; fOc.onchange = renderModulos;
  renderModulos();

  // Dúvidas
  var pend = d.duvidas.filter(function (q) { return q.status !== 'decidida'; });
  document.getElementById('h-duvidas').textContent = 'Dúvidas para sua decisão (' + pend.length + ' pendente' + (pend.length === 1 ? '' : 's') + ')';
  var dbox = document.getElementById('duvidas');
  if (!d.duvidas.length) dbox.appendChild(el('p', 'vazio', 'Nenhuma dúvida no momento.'));
  pend.concat(d.duvidas.filter(function (q) { return q.status === 'decidida'; })).forEach(function (q) {
    var r = resp[q.id] || (resp[q.id] = { escolha: '', texto: '' });
    var c = el('div', 'duvida' + (q.status === 'decidida' ? ' decidida' : ''));
    c.appendChild(el('h3', null, q.id + ' — ' + q.pergunta));
    var ctx = [q.contexto, q.origem ? 'origem: ' + q.origem : '', q.bloqueia && q.bloqueia.length ? 'bloqueia: ' + q.bloqueia.join(', ') : ''].filter(Boolean).join(' · ');
    if (ctx) c.appendChild(el('p', 'ctx', ctx));
    if (q.status === 'decidida') {
      c.appendChild(el('p', null, 'Decidido: ' + q.decisao));
      dbox.appendChild(c); return;
    }
    (q.sugestoes || []).forEach(function (s, i) {
      var lab = el('label', 'opcao');
      var inp = el('input'); inp.type = 'radio'; inp.name = q.id; inp.value = s.texto; inp.checked = r.escolha === s.texto;
      inp.onchange = function () { r.escolha = s.texto; salvar(); };
      lab.appendChild(inp);
      var t = el('span'); t.appendChild(document.createTextNode(String.fromCharCode(65 + i) + ') ' + s.texto));
      if (s.recomendada) t.appendChild(el('span', 'rec', 'recomendada'));
      if (s.motivo) t.appendChild(el('small', null, s.motivo));
      lab.appendChild(t);
      c.appendChild(lab);
    });
    var ta = el('textarea'); ta.placeholder = 'Sua resposta, ajuste ou outra opção (campo livre)'; ta.value = r.texto;
    ta.oninput = function () { r.texto = ta.value; salvar(); };
    c.appendChild(ta);
    dbox.appendChild(c);
  });

  function aviso(m) { var a = document.getElementById('aviso'); a.textContent = m; setTimeout(function () { a.textContent = ''; }, 3000); }
  document.getElementById('copiar').onclick = function () {
    var linhas = ['Respostas do painel — ' + d.feature, ''];
    pend.forEach(function (q) {
      var r = resp[q.id] || {};
      if (!r.escolha && !r.texto) return;
      linhas.push(q.id + ' — ' + q.pergunta);
      if (r.escolha) linhas.push('  Escolha: ' + r.escolha);
      if (r.texto) linhas.push('  Comentário: ' + r.texto.replace(/\n/g, '\n  '));
      linhas.push('');
    });
    if (linhas.length === 2) { aviso('Nenhuma resposta preenchida.'); return; }
    var txt = linhas.join('\n');
    function fallback() { var t = el('textarea'); t.value = txt; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); aviso('Copiado. Cole no chat.'); }
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { aviso('Copiado. Cole no chat.'); }, fallback); else fallback();
  };
  document.getElementById('limpar').onclick = function () {
    if (!confirm('Apagar todas as respostas deste painel?')) return;
    resp = {}; salvar(); location.reload();
