[package]
name = "launcher-win"
description = "Infraestrutura Windows do Sofa: adapters que implementam os ports do launcher-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Testes de integracao que tocam o sistema (runner Windows).
win-integration = []

[dependencies]
launcher-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
keyvalues-parser.workspace = true
image.workspace = true
windows-core = "0.58"
windows = { workspace = true, features = [
  "implement",
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Shutdown",
  "Win32_System_SystemInformation",
  "Win32_System_TaskScheduler",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_System_IO",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_XboxController",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
# Jogo sintetico dos testes de integracao (janela, filho, WM_CLOSE ignorado, dump de argumentos).
# Nunca entra no instalador: o bundler do Tauri empacota so o `sofa.exe`.
name = "sofa-test-game"
path = "src/bin/sofa_test_game.rs"
test = false
