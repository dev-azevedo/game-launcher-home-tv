[package]
name = "sofa"
description = "Sofa: launcher de jogos para TV (apresentacao e composition root)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "sofa"

[lib]
name = "sofa_lib"
# Sem testes unitarios na lib: o binario de teste dela nao tem o manifesto Common Controls v6
# (ver build.rs). Os testes ficam em tests/, que recebem o manifesto.
test = false

[[bin]]
name = "sofa"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3.0.12"
tauri-build = { version = "2", features = [] }

[dependencies]
launcher-core.workspace = true
launcher-win.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", default-features = false, features = ["wry", "compression"] }
tracing = "0.1.44"
ts-rs = "10.1.0"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
