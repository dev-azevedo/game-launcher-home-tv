[package]
name = "sofa"
description = "Sofa: launcher de jogos para TV (apresentacao e composition root)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "sofa"

[lib]
name = "sofa_lib"

[[bin]]
name = "sofa"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
launcher-core.workspace = true
launcher-win.workspace = true
tauri = { version = "2", default-features = false, features = ["wry", "compression"] }
