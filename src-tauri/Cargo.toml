[package]
name = "sofa"
description = "Sofa: launcher de jogos para TV (apresentacao e composition root)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "sofa"

[lib]
name = "sofa_lib"
# Sem testes unitarios na lib: o binario de teste dela nao tem o manifesto Common Controls v6
# (ver build.rs). Os testes ficam em tests/, que recebem o manifesto.
test = false

[[bin]]
name = "sofa"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3.0.12"
tauri-build = { version = "2", features = [] }

[dependencies]
launcher-core.workspace = true
launcher-win.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", default-features = false, features = ["wry", "compression"] }
# BE-35 (SEC-19): so traz a janela; o callback descarta argv e cwd.
tauri-plugin-single-instance = "2.5"
# SEC-33, ADR-0008: atualizacao do app so pelo Rust (sem permissao na capability). TLS do Windows
# (schannel via native-tls), sem rustls e sem zip.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls"] }
tracing = "0.1.44"
ts-rs = "10.1.0"
webview2-com = "0.39"
windows-core = "0.62"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
